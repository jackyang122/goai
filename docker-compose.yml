# Personal Learning OS — local Postgres + pgvector for the `src/` backend.
#
#   docker compose up -d postgres
#   cd src && alembic upgrade head && python -m plos.cli seed
#
# The pgvector/pgvector image bundles the `vector` extension; the app also runs
# `CREATE EXTENSION IF NOT EXISTS vector` on startup, so either path works.
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: plos-postgres
    environment:
      POSTGRES_USER: plos
      POSTGRES_PASSWORD: plos
      POSTGRES_DB: plos
    ports:
      - "5432:5432"
    volumes:
      - plos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plos -d plos"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  plos_pgdata:
