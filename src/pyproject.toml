[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plos"
version = "0.1.0"
description = "Personal Learning OS — agent-native personalized learning backend (FastAPI)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Personal Learning OS" }]
dependencies = [
  # Web framework + ASGI
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "starlette>=0.36",
  "python-multipart>=0.0.9",
  "websockets>=12.0",
  # Data validation + config
  "pydantic>=2.6",
  "pydantic-settings>=2.1",
  # DB
  "SQLAlchemy[asyncio]>=2.0.25",
  "asyncpg>=0.29",
  "pgvector>=0.2.4",
  "alembic>=1.13",
  # Utilities
  "python-ulid>=2.2",
  "httpx>=0.27",
  "anyio>=4.2",
]

[project.optional-dependencies]
# Real provider seams — each optional; app boots with stubs when absent.
llm = ["litellm>=1.83"]
embed = ["FlagEmbedding>=1.2.7", "torch>=2.1"]
rag = [
  "llama-index>=0.10",
  "llama-index-vector-stores-postgres>=0.1",
  "llama-index-embeddings-huggingface>=0.1",
  "rank-bm25>=0.2.2",
]
mem0 = ["mem0ai>=0.1.13"]
bkt = ["pybkt>=1.2"]
fsrs = ["fsrs>=4.0"]
parse = ["docling>=2.0", "pymupdf4llm>=0.0.10"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=4.1",
  "ruff>=0.4",
  "mypy>=1.8",
  "httpx>=0.27",
]
all = [
  "litellm>=1.83",
  "FlagEmbedding>=1.2.7",
  "torch>=2.1",
  "llama-index>=0.10",
  "llama-index-vector-stores-postgres>=0.1",
  "llama-index-embeddings-huggingface>=0.1",
  "rank-bm25>=0.2.2",
  "mem0ai>=0.1.13",
  "pybkt>=1.2",
  "fsrs>=4.0",
  "docling>=2.0",
  "pymupdf4llm>=0.0.10",
]

[project.scripts]
plos = "plos.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["plos*"]

# ── Tooling ───────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["plos/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4"]
ignore = ["E501", "B008"]  # E501 handled by line-length; B008 FastAPI Depends() default

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
